name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        run: test -n "$ANDROID_HOME" && test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Run contract tests
        run: node --test tests/*.test.js

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        env:
          EXPO_PUBLIC_DEMO_MODE: 'true'
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-2-agentic-fork-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
