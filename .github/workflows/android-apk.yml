name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        run: test -n "$ANDROID_HOME" && test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Run contract tests
        run: node --test tests/*.test.js

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        env:
          EXPO_PUBLIC_DEMO_MODE: 'false'
        run: npx expo prebuild --platform android --non-interactive

      - name: Embed JavaScript bundle in debug APK
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file, 'utf8');
          const start = source.indexOf('react {');
          const end = start < 0 ? -1 : source.indexOf('\n}', start);
          if (start < 0 || end < 0) throw new Error('React Gradle block was not found.');
          let block = source.slice(start, end);
          if (/debuggableVariants\s*=/.test(block)) {
            block = block.replace(/debuggableVariants\s*=\s*\[[^\]]*\]/, 'debuggableVariants = []');
          } else {
            block += '\n    debuggableVariants = []';
          }
          fs.writeFileSync(file, source.slice(0, start) + block + source.slice(end));
          NODE

      - name: Build standalone debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-2-agentic-fork-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
